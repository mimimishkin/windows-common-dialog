[package]
name = "desktop-native-chooser-dialog"
version = "0.0.1"
edition = "2024"

[features]
java = ["dep:jni"]

#[build-dependencies]
#cbindgen = "0.29.0"

[dependencies]
jni = { version = "0.21.1", optional = true }

[target.'cfg(target_os="windows)'.dependencies]
windows = { version = "0.61.1", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.61.0"
windows-registry = "0.5.1"

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1", features = ["NSApplication", "NSWindow", "objc2-uniform-type-identifiers", "block2"] }
objc2-uniform-type-identifiers = "0.3.1"
objc2-core-foundation = "0.3.1"
objc2-foundation = "0.3.1"
dispatch2 = "0.3.0"
block2 = "0.6.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
